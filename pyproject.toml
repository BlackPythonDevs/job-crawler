[project]
name = "job-crawler"
version = "0.2.0"
description = "Long-running job board crawler that posts new openings via Apprise."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "pydantic-ai[openai]",
    "uvicorn[standard]>=0.30",
    "valkey>=6.0",
]

[project.scripts]
job-crawler = "job_crawler.bot:main"
job-preflight = "job_crawler.preflight:run"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
]

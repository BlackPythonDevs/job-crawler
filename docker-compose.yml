services:
  valkey:
    image: valkey/valkey
    command: valkey-server --save 60 1 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data

  bot:
    build: .
    depends_on:
      - valkey
    env_file: .env
    environment:
      VALKEY_URL: valkey://valkey:6379/0
    ports:
      - "8080:8080"
    volumes:
      - ./config.toml:/app/config.toml:ro

volumes:
  valkey-data:
